name: Deploy Loop

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Lint (frontend)
        working-directory: artifacts/loop
        run: pnpm run lint

  # ── 2. Type-check ──────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck Worker
        working-directory: artifacts/cloudflare-worker
        run: pnpm exec tsc --noEmit
      - name: Typecheck Frontend
        working-directory: artifacts/loop
        run: pnpm exec tsc --noEmit

  # ── 3. Tests ───────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Run test suite
        working-directory: artifacts/loop
        run: pnpm run test

  # ── 4. Security ────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Security audit (hard fail)
        run: pnpm audit --audit-level=high

  # ── 5. Deploy Cloudflare Worker ────────────────────────────────────
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile

      - name: Deploy Worker (production environment)
        working-directory: artifacts/cloudflare-worker
        run: pnpm exec wrangler deploy --env production

      - name: Push RALD_JWT_SECRET to worker
        working-directory: artifacts/cloudflare-worker
        env:
          RALD_JWT_SECRET: ${{ secrets.RALD_JWT_SECRET }}
        run: |
          if [ -z "$RALD_JWT_SECRET" ]; then
            echo "FATAL: RALD_JWT_SECRET is not set in GitHub secrets" && exit 1
          fi
          echo "$RALD_JWT_SECRET" | pnpm exec wrangler secret put RALD_JWT_SECRET --env production

      - name: Push LOOP_JWT_SECRET to worker
        working-directory: artifacts/cloudflare-worker
        env:
          LOOP_JWT_SECRET: ${{ secrets.LOOP_JWT_SECRET }}
        run: |
          if [ -z "$LOOP_JWT_SECRET" ]; then
            echo "FATAL: LOOP_JWT_SECRET is not set in GitHub secrets" && exit 1
          fi
          echo "$LOOP_JWT_SECRET" | pnpm exec wrangler secret put LOOP_JWT_SECRET --env production

      - name: Push SUPABASE_SERVICE_ROLE_KEY to worker
        working-directory: artifacts/cloudflare-worker
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "FATAL: SUPABASE_SERVICE_ROLE_KEY is not set in GitHub secrets" && exit 1
          fi
          echo "$SUPABASE_SERVICE_ROLE_KEY" | pnpm exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env production

      - name: Record deployment audit
        if: always()
        run: |
          echo "AUDIT LOG: service=loop-worker commit=${{ github.sha }} author=${{ github.actor }} timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ) status=${{ job.status }} run_id=${{ github.run_id }} branch=${{ github.ref_name }}"

  # ── 6. Deploy Cloudflare Pages ─────────────────────────────────────
  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        working-directory: artifacts/loop
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        working-directory: artifacts/loop
        run: pnpm exec wrangler pages deploy dist --project-name=loop --branch=main

      - name: Record deployment audit
        if: always()
        run: |
          echo "AUDIT LOG: service=loop-pages commit=${{ github.sha }} author=${{ github.actor }} timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ) status=${{ job.status }} run_id=${{ github.run_id }} branch=${{ github.ref_name }}"
