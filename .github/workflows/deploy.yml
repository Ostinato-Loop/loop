name: Deploy Loop

on:
  push:
    branches: [main, replit-v1]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  # ── 1. Type-check ─────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck Worker
        working-directory: artifacts/cloudflare-worker
        run: pnpm exec tsc --noEmit
      - name: Typecheck Frontend
        working-directory: artifacts/loop
        run: pnpm exec tsc --noEmit

  # ── 2. Deploy Cloudflare Worker ───────────────────────────────────
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        working-directory: artifacts/cloudflare-worker
        run: pnpm exec wrangler deploy

  # ── 3. Build & Deploy Frontend to Cloudflare Pages ───────────────
  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Build Loop frontend
        working-directory: artifacts/loop
        env:
          VITE_SUPABASE_URL: https://onxdcikfttdmnhofsuwo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: https://loop-api.ostinato-loop.workers.dev
          VITE_DEV_MODE_MOCK_OTP: "false"
          BASE_PATH: "/"
          PORT: "3000"
          NODE_ENV: production
        run: pnpm run build

      - name: Install Wrangler globally
        run: npm install -g wrangler@latest

      - name: Create Pages project (idempotent)
        run: wrangler pages project create loop --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy artifacts/loop/dist/public --project-name=loop --branch=${{ github.ref_name }}
