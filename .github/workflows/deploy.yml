name: Deploy Loop

on:
  push:
    branches: [main, replit-v1]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  # ── 1. Type-check & lint ───────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck Worker
        working-directory: artifacts/cloudflare-worker
        run: pnpm exec tsc --noEmit
      - name: Typecheck Frontend
        working-directory: artifacts/loop
        run: pnpm exec tsc --noEmit

  # ── 2. Deploy Cloudflare Worker ───────────────────────────────────
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Set Wrangler secrets
        working-directory: artifacts/cloudflare-worker
        run: |
          echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | pnpm exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          echo "${{ secrets.TERMII_API_KEY }}"            | pnpm exec wrangler secret put TERMII_API_KEY
          echo "${{ secrets.TERMII_SENDER_ID }}"          | pnpm exec wrangler secret put TERMII_SENDER_ID
          echo "${{ secrets.LOOP_JWT_SECRET }}"           | pnpm exec wrangler secret put LOOP_JWT_SECRET
          echo "${{ secrets.OPENROUTER_API_KEY || '' }}"  | pnpm exec wrangler secret put OPENROUTER_API_KEY || true

      - name: Deploy Worker
        working-directory: artifacts/cloudflare-worker
        run: pnpm exec wrangler deploy --env production

  # ── 3. Build & Deploy Frontend to Cloudflare Pages ───────────────
  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Build Loop frontend
        working-directory: artifacts/loop
        env:
          VITE_SUPABASE_URL: https://onxdcikfttdmnhofsuwo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: https://loop-api.ostinato-loop.workers.dev
          VITE_DEV_MODE_MOCK_OTP: "false"
          BASE_PATH: "/"
          PORT: "3000"
          NODE_ENV: production
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy artifacts/loop/dist/public --project-name=loop --branch=${{ github.ref_name }}
