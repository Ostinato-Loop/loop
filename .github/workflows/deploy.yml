name: Deploy Loop

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  # ── 1. Type-check ──────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck Worker
        working-directory: artifacts/cloudflare-worker
        run: pnpm exec tsc --noEmit
      - name: Typecheck Frontend
        working-directory: artifacts/loop
        run: pnpm exec tsc --noEmit

  # ── 2. Deploy Cloudflare Worker ────────────────────────────────────
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile

      - name: Deploy Worker (production environment)
        working-directory: artifacts/cloudflare-worker
        run: pnpm exec wrangler deploy --env production

      - name: Push RALD_JWT_SECRET to worker
        working-directory: artifacts/cloudflare-worker
        env:
          RALD_JWT_SECRET: ${{ secrets.RALD_JWT_SECRET }}
        run: |
          if [ -z "$RALD_JWT_SECRET" ]; then
            echo "FATAL: RALD_JWT_SECRET is not set in loop GitHub secrets" && exit 1
          fi
          echo "$RALD_JWT_SECRET" | pnpm exec wrangler secret put RALD_JWT_SECRET --env production
          echo "RALD_JWT_SECRET pushed"

      - name: Push LOOP_JWT_SECRET to worker
        working-directory: artifacts/cloudflare-worker
        env:
          LOOP_JWT_SECRET: ${{ secrets.LOOP_JWT_SECRET }}
        run: |
          if [ -z "$LOOP_JWT_SECRET" ]; then
            echo "FATAL: LOOP_JWT_SECRET is not set in GitHub secrets" && exit 1
          fi
          echo "$LOOP_JWT_SECRET" | pnpm exec wrangler secret put LOOP_JWT_SECRET --env production
          echo "LOOP_JWT_SECRET pushed"

      - name: Push SUPABASE_SERVICE_ROLE_KEY to worker
        working-directory: artifacts/cloudflare-worker
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "FATAL: SUPABASE_SERVICE_ROLE_KEY is not set in GitHub secrets" && exit 1
          fi
          echo "$SUPABASE_SERVICE_ROLE_KEY" | pnpm exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env production
          echo "SUPABASE_SERVICE_ROLE_KEY pushed"

      - name: Push TERMII_API_KEY to worker
        working-directory: artifacts/cloudflare-worker
        env:
          TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
        run: |
          if [ -n "$TERMII_API_KEY" ]; then
            echo "$TERMII_API_KEY" | pnpm exec wrangler secret put TERMII_API_KEY --env production
            echo "TERMII_API_KEY pushed"
          fi

      - name: Push TERMII_SENDER_ID to worker
        working-directory: artifacts/cloudflare-worker
        env:
          TERMII_SENDER_ID: ${{ secrets.TERMII_SENDER_ID }}
        run: |
          if [ -n "$TERMII_SENDER_ID" ]; then
            echo "$TERMII_SENDER_ID" | pnpm exec wrangler secret put TERMII_SENDER_ID --env production
            echo "TERMII_SENDER_ID pushed"
          fi

      - name: Push OPENROUTER_API_KEY to worker
        working-directory: artifacts/cloudflare-worker
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "$OPENROUTER_API_KEY" | pnpm exec wrangler secret put OPENROUTER_API_KEY --env production
            echo "OPENROUTER_API_KEY pushed"
          fi

  # ── 3. Build & Deploy Frontend to Cloudflare Pages ────────────────
  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile

      - name: Build Loop frontend
        working-directory: artifacts/loop
        env:
          VITE_SUPABASE_URL: https://onxdcikfttdmnhofsuwo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: https://loop-api.rald.cloud
          VITE_DEV_MODE_MOCK_OTP: "false"
          BASE_PATH: "/"
          PORT: "3000"
          NODE_ENV: production
        run: pnpm run build

      - name: Install Wrangler globally
        run: npm install -g wrangler@latest

      - name: Create Pages project (idempotent)
        run: wrangler pages project create loop --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy artifacts/loop/dist/public --project-name=loop --branch=${{ github.ref_name }}

      - name: Add loop.rald.cloud custom domain (idempotent)
        run: |
          wrangler pages domain add loop loop.rald.cloud || echo "Domain already configured or pending DNS"
