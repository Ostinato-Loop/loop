name: Deploy Loop

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Lint (frontend)
        working-directory: artifacts/loop
        run: pnpm run lint

  # ── 2. Type-check ────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck Worker
        working-directory: artifacts/cloudflare-worker
        run: pnpm exec tsc --noEmit
      - name: Typecheck Frontend
        working-directory: artifacts/loop
        run: pnpm exec tsc --noEmit

  # ── 3. Tests ─────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Worker tests
        working-directory: artifacts/cloudflare-worker
        run: pnpm run test
      - name: Frontend tests
        working-directory: artifacts/loop
        run: pnpm run test

  # ── 4. Security ────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Security audit (hard fail)
        run: pnpm audit --audit-level=critical

  # ── 5. Deploy Cloudflare Worker ────────────────────────────────────
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile

      - name: Deploy Worker (production environment + embed commit SHA)
        working-directory: artifacts/cloudflare-worker
        run: pnpm exec wrangler deploy --env production --var "COMMIT_SHA:${{ github.sha }}"

      # ── Secrets: push all required worker secrets ──────────────────
      - name: Push RALD_JWT_SECRET to worker
        working-directory: artifacts/cloudflare-worker
        env:
          RALD_JWT_SECRET: ${{ secrets.RALD_JWT_SECRET }}
        run: |
          if [ -z "$RALD_JWT_SECRET" ]; then
            echo "FATAL: RALD_JWT_SECRET is not set in GitHub secrets" && exit 1
          fi
          echo "$RALD_JWT_SECRET" | pnpm exec wrangler secret put RALD_JWT_SECRET --env production

      - name: Push SUPABASE_SERVICE_ROLE_KEY to worker
        working-directory: artifacts/cloudflare-worker
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "FATAL: SUPABASE_SERVICE_ROLE_KEY is not set in GitHub secrets" && exit 1
          fi
          echo "$SUPABASE_SERVICE_ROLE_KEY" | pnpm exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env production

      - name: Push TERMII_API_KEY to worker
        working-directory: artifacts/cloudflare-worker
        env:
          TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
        run: |
          if [ -z "$TERMII_API_KEY" ]; then
            echo "FATAL: TERMII_API_KEY is not set in GitHub secrets" && exit 1
          fi
          echo "$TERMII_API_KEY" | pnpm exec wrangler secret put TERMII_API_KEY --env production

      - name: Push TERMII_SENDER_ID to worker
        working-directory: artifacts/cloudflare-worker
        env:
          TERMII_SENDER_ID: ${{ secrets.TERMII_SENDER_ID }}
        run: |
          if [ -z "$TERMII_SENDER_ID" ]; then
            echo "FATAL: TERMII_SENDER_ID is not set in GitHub secrets" && exit 1
          fi
          echo "$TERMII_SENDER_ID" | pnpm exec wrangler secret put TERMII_SENDER_ID --env production

      - name: Push LIVEKIT_API_KEY to worker
        working-directory: artifacts/cloudflare-worker
        env:
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
        run: |
          if [ -z "$LIVEKIT_API_KEY" ]; then
            echo "WARNING: LIVEKIT_API_KEY not set — audio rooms will be unavailable" && exit 0
          fi
          echo "$LIVEKIT_API_KEY" | pnpm exec wrangler secret put LIVEKIT_API_KEY --env production

      - name: Push LIVEKIT_API_SECRET to worker
        working-directory: artifacts/cloudflare-worker
        env:
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          if [ -z "$LIVEKIT_API_SECRET" ]; then
            echo "WARNING: LIVEKIT_API_SECRET not set — audio rooms will be unavailable" && exit 0
          fi
          echo "$LIVEKIT_API_SECRET" | pnpm exec wrangler secret put LIVEKIT_API_SECRET --env production

      - name: Push MESSENGER_WEBHOOK_KEY to worker
        working-directory: artifacts/cloudflare-worker
        env:
          MESSENGER_WEBHOOK_KEY: ${{ secrets.MESSENGER_WEBHOOK_KEY }}
        run: |
          if [ -z "$MESSENGER_WEBHOOK_KEY" ]; then
            echo "WARNING: MESSENGER_WEBHOOK_KEY not set — DM notifications will be unavailable" && exit 0
          fi
          echo "$MESSENGER_WEBHOOK_KEY" | pnpm exec wrangler secret put MESSENGER_WEBHOOK_KEY --env production

      # ── Cross-worker: sync critical secrets to rald-auth ─────────────
      # rald-auth-core CI billing failures prevent its own deploy.
      # Piggyback here to keep RALD_JWT_SECRET in sync (SSO breaks if diverged)
      # and push RESEND_API_KEY (email OTPs) + TERMII creds (SMS OTPs).
      - name: Sync RALD_JWT_SECRET → rald-auth worker
        working-directory: artifacts/cloudflare-worker
        env:
          RALD_JWT_SECRET: ${{ secrets.RALD_JWT_SECRET }}
        run: |
          if [ -z "$RALD_JWT_SECRET" ]; then
            echo "WARNING: RALD_JWT_SECRET not set — skipping rald-auth sync" && exit 0
          fi
          echo "$RALD_JWT_SECRET" | pnpm exec wrangler secret put RALD_JWT_SECRET --name rald-auth 2>/dev/null \
            && echo "RALD_JWT_SECRET synced to rald-auth" \
            || echo "WARNING: Could not sync RALD_JWT_SECRET to rald-auth (non-fatal)"

      - name: Sync RESEND_API_KEY → rald-auth + rald-notify workers
        working-directory: artifacts/cloudflare-worker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "WARNING: RESEND_API_KEY not in repo secrets — email OTPs + email notifications disabled" && exit 0
          fi
          echo "$RESEND_API_KEY" | pnpm exec wrangler secret put RESEND_API_KEY --name rald-auth 2>/dev/null \
            && echo "RESEND_API_KEY → rald-auth ✓" \
            || echo "WARNING: Could not sync RESEND_API_KEY to rald-auth (non-fatal)"
          echo "$RESEND_API_KEY" | pnpm exec wrangler secret put RESEND_API_KEY --name rald-notify 2>/dev/null \
            && echo "RESEND_API_KEY → rald-notify ✓" \
            || echo "WARNING: Could not sync RESEND_API_KEY to rald-notify (non-fatal)"

      - name: Sync TERMII creds → rald-auth worker
        working-directory: artifacts/cloudflare-worker
        env:
          TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
          TERMII_SENDER_ID: ${{ secrets.TERMII_SENDER_ID }}
        run: |
          [ -n "$TERMII_API_KEY" ] && echo "$TERMII_API_KEY" | pnpm exec wrangler secret put TERMII_API_KEY --name rald-auth 2>/dev/null && echo "TERMII_API_KEY → rald-auth ✓" || true
          [ -n "$TERMII_SENDER_ID" ] && echo "$TERMII_SENDER_ID" | pnpm exec wrangler secret put TERMII_SENDER_ID --name rald-auth 2>/dev/null && echo "TERMII_SENDER_ID → rald-auth ✓" || true

      # ── Cross-worker: sync LiveKit credentials to rald-realtime ──────────
      # rald-realtime returns 503 without at least one provider key set.
      # LiveKit secrets live in loop repo; push them here on every deploy.
      - name: Sync LIVEKIT_API_KEY → rald-realtime worker
        working-directory: artifacts/cloudflare-worker
        env:
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
        run: |
          if [ -z "$LIVEKIT_API_KEY" ]; then
            echo "WARNING: LIVEKIT_API_KEY not set — skipping rald-realtime sync" && exit 0
          fi
          echo "$LIVEKIT_API_KEY" | pnpm exec wrangler secret put LIVEKIT_API_KEY --name rald-realtime 2>/dev/null \
            && echo "LIVEKIT_API_KEY → rald-realtime ✓" \
            || echo "WARNING: Could not sync LIVEKIT_API_KEY to rald-realtime (non-fatal)"

      - name: Sync LIVEKIT_API_SECRET → rald-realtime worker
        working-directory: artifacts/cloudflare-worker
        env:
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          if [ -z "$LIVEKIT_API_SECRET" ]; then
            echo "WARNING: LIVEKIT_API_SECRET not set — skipping rald-realtime sync" && exit 0
          fi
          echo "$LIVEKIT_API_SECRET" | pnpm exec wrangler secret put LIVEKIT_API_SECRET --name rald-realtime 2>/dev/null \
            && echo "LIVEKIT_API_SECRET → rald-realtime ✓" \
            || echo "WARNING: Could not sync LIVEKIT_API_SECRET to rald-realtime (non-fatal)"

      - name: Sync LIVEKIT_URL → rald-realtime worker
        working-directory: artifacts/cloudflare-worker
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
        run: |
          if [ -z "$LIVEKIT_URL" ]; then
            echo "WARNING: LIVEKIT_URL not set — skipping rald-realtime sync" && exit 0
          fi
          echo "$LIVEKIT_URL" | pnpm exec wrangler secret put LIVEKIT_URL --name rald-realtime 2>/dev/null \
            && echo "LIVEKIT_URL → rald-realtime ✓" \
            || echo "WARNING: Could not sync LIVEKIT_URL to rald-realtime (non-fatal)"

      # ── Cross-worker: Tencent RTC + Cloudflare Calls (voice rooms fallback) ──
      # Add TENCENT_SDK_APP_ID + TENCENT_SECRET_KEY + CALLS_APP_ID + CALLS_APP_SECRET
      # to loop repo secrets to enable these providers automatically.
      - name: Sync TENCENT_SDK_APP_ID → rald-realtime worker
        working-directory: artifacts/cloudflare-worker
        env:
          TENCENT_SDK_APP_ID: ${{ secrets.TENCENT_SDK_APP_ID }}
        run: |
          [ -n "$TENCENT_SDK_APP_ID" ] && echo "$TENCENT_SDK_APP_ID" | pnpm exec wrangler secret put TENCENT_SDK_APP_ID --name rald-realtime 2>/dev/null && echo "TENCENT_SDK_APP_ID → rald-realtime ✓" || echo "ℹ️  TENCENT_SDK_APP_ID not set — Tencent RTC unavailable (non-fatal)"

      - name: Sync TENCENT_SECRET_KEY → rald-realtime worker
        working-directory: artifacts/cloudflare-worker
        env:
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          [ -n "$TENCENT_SECRET_KEY" ] && echo "$TENCENT_SECRET_KEY" | pnpm exec wrangler secret put TENCENT_SECRET_KEY --name rald-realtime 2>/dev/null && echo "TENCENT_SECRET_KEY → rald-realtime ✓" || echo "ℹ️  TENCENT_SECRET_KEY not set (non-fatal)"

      - name: Sync CALLS_APP_ID + CALLS_APP_SECRET → rald-realtime worker
        working-directory: artifacts/cloudflare-worker
        env:
          CALLS_APP_ID:     ${{ secrets.CALLS_APP_ID }}
          CALLS_APP_SECRET: ${{ secrets.CALLS_APP_SECRET }}
        run: |
          [ -n "$CALLS_APP_ID" ] && echo "$CALLS_APP_ID" | pnpm exec wrangler secret put CALLS_APP_ID --name rald-realtime 2>/dev/null && echo "CALLS_APP_ID → rald-realtime ✓" || echo "ℹ️  CALLS_APP_ID not set (non-fatal)"
          [ -n "$CALLS_APP_SECRET" ] && echo "$CALLS_APP_SECRET" | pnpm exec wrangler secret put CALLS_APP_SECRET --name rald-realtime 2>/dev/null && echo "CALLS_APP_SECRET → rald-realtime ✓" || echo "ℹ️  CALLS_APP_SECRET not set (non-fatal)"

      # ── Cross-worker: VAPID web push keys → rald-realtime + rald-notify ────
      # Add VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT to loop secrets
      # to enable Web Push notifications from room events.
      - name: Sync VAPID keys → rald-realtime + rald-notify
        working-directory: artifacts/cloudflare-worker
        env:
          VAPID_PUBLIC_KEY:  ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:     ${{ secrets.VAPID_SUBJECT }}
        run: |
          if [ -n "$VAPID_PUBLIC_KEY" ]; then
            echo "$VAPID_PUBLIC_KEY"  | pnpm exec wrangler secret put VAPID_PUBLIC_KEY  --name rald-realtime 2>/dev/null && echo "VAPID_PUBLIC_KEY → rald-realtime ✓"
            echo "$VAPID_PRIVATE_KEY" | pnpm exec wrangler secret put VAPID_PRIVATE_KEY --name rald-realtime 2>/dev/null && echo "VAPID_PRIVATE_KEY → rald-realtime ✓"
            echo "$VAPID_SUBJECT"     | pnpm exec wrangler secret put VAPID_SUBJECT     --name rald-realtime 2>/dev/null && echo "VAPID_SUBJECT → rald-realtime ✓"
            echo "$VAPID_PUBLIC_KEY"  | pnpm exec wrangler secret put VAPID_PUBLIC_KEY  --name rald-notify 2>/dev/null && echo "VAPID_PUBLIC_KEY → rald-notify ✓"
            echo "$VAPID_PRIVATE_KEY" | pnpm exec wrangler secret put VAPID_PRIVATE_KEY --name rald-notify 2>/dev/null && echo "VAPID_PRIVATE_KEY → rald-notify ✓"
            echo "$VAPID_SUBJECT"     | pnpm exec wrangler secret put VAPID_SUBJECT     --name rald-notify 2>/dev/null && echo "VAPID_SUBJECT → rald-notify ✓"
          else
            echo "ℹ️  VAPID keys not set — Web Push unavailable (add VAPID_PUBLIC_KEY/PRIVATE_KEY/SUBJECT to loop secrets)"
          fi

      - name: Post-deploy smoke test (Worker)
        run: |
          sleep 5
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://loop-api.rald.cloud/api/health || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "FATAL: post-deploy worker health check failed (HTTP $STATUS)" && exit 1
          fi
          DEPLOYED_SHA=$(curl -sf https://loop-api.rald.cloud/api/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha','unknown'))" 2>/dev/null || echo "unknown")
          echo "SMOKE TEST PASSED: /api/health returned HTTP $STATUS (sha=$DEPLOYED_SHA, expected=${{ github.sha }})"
          if [ "$DEPLOYED_SHA" != "unknown" ] && [ "$DEPLOYED_SHA" != "${{ github.sha }}" ]; then
            echo "WARNING: deployed SHA ($DEPLOYED_SHA) does not match github.sha (${{ github.sha }}) — Cloudflare may still be propagating"
          fi

      - name: Record deployment audit (Worker)
        if: always()
        run: |
          echo "AUDIT LOG: service=loop-worker commit=${{ github.sha }} author=${{ github.actor }} timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ) status=${{ job.status }} run_id=${{ github.run_id }} branch=${{ github.ref_name }}"

  # ── 6. Deploy Cloudflare Pages ─────────────────────────────────
  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        working-directory: artifacts/loop
        run: pnpm run build
        env:
          PORT: "3000"
          BASE_PATH: "/"
          NODE_ENV: production
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_API_BASE_URL: https://loop-api.rald.cloud

      - name: Ensure Cloudflare Pages project exists (idempotent)
        env:
          CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4.16.0 pages project create loop --production-branch=main 2>/dev/null \
            && echo "Pages project 'loop' created" \
            || echo "Pages project 'loop' already exists — continuing"

      - name: Deploy to Cloudflare Pages
        working-directory: artifacts/loop
        env:
          CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "FATAL: CLOUDFLARE_API_TOKEN not set — Pages deploy aborted."
            echo "Add this secret with Cloudflare Pages:Edit permission."
            exit 1
          fi
          if npx wrangler@4.16.0 pages deploy dist/public --project-name=loop --branch=main; then
            echo "Cloudflare Pages deploy succeeded"
          else
            echo "FAIL: Cloudflare Pages deploy failed."
            echo "Verify CLOUDFLARE_API_TOKEN has Cloudflare Pages:Edit permission."
            exit 1
          fi

      - name: Post-deploy smoke test (Pages)
        run: |
          sleep 10
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://loop.rald.cloud || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "FATAL: post-deploy Pages smoke test failed (HTTP $STATUS for https://loop.rald.cloud)" && exit 1
          fi
          echo "SMOKE TEST PASSED: https://loop.rald.cloud returned HTTP $STATUS"

      - name: Record deployment audit (Pages)
        if: always()
        run: |
          echo "AUDIT LOG: service=loop-pages commit=${{ github.sha }} author=${{ github.actor }} timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ) status=${{ job.status }} run_id=${{ github.run_id }} branch=${{ github.ref_name }}"
