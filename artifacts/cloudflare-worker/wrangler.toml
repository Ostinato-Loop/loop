# ============================================================
# Loop V1 — Cloudflare Worker
# Production: loop-api.rald.cloud
# ============================================================
name               = "loop-api"
main               = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Disable .workers.dev URL globally (use custom domain only)
workers_dev = false

# ── D1 — Primary SQL database ─────────────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "loop-db"
database_id   = "4616fcac-96e0-4150-a42f-3d020f45cd1d"

# ── KV — Sessions, rate limits, OTP store ─────────────────
[[kv_namespaces]]
binding    = "CACHE"
id         = "3c71da01b3174d6c9353adbfde7491a3"
preview_id = "3c71da01b3174d6c9353adbfde7491a3"

# ── R2 — Object storage ───────────────────────────────────
[[r2_buckets]]
binding     = "MEDIA"
bucket_name = "loop-media"

# ── Queues ────────────────────────────────────────────────
[[queues.producers]]
binding = "TASK_QUEUE"
queue   = "loop-tasks"

[[queues.consumers]]
queue             = "loop-tasks"
max_batch_size    = 10
max_batch_timeout = 5

# ── Durable Objects ───────────────────────────────────────
[[durable_objects.bindings]]
name       = "ROOM_SESSION"
class_name = "RoomSession"

[[migrations]]
tag                = "v1"
new_sqlite_classes = ["RoomSession"]

# ── Workers AI ────────────────────────────────────────────
[ai]
binding = "AI"

# ── Observability ─────────────────────────────────────────
[observability]
enabled = true

# ── Default env vars (development / wrangler dev) ────────
[vars]
ENVIRONMENT   = "development"
SUPABASE_URL  = "https://onxdcikfttdmnhofsuwo.supabase.co"
CORS_ORIGIN   = "*"
RALD_AUTH_URL = "https://auth.rald.cloud"

# Secrets — set via: wrangler secret put <KEY>
# RALD_JWT_SECRET
# SUPABASE_SERVICE_ROLE_KEY
# TERMII_API_KEY
# TERMII_SENDER_ID
# OPENROUTER_API_KEY
# LIVEKIT_API_KEY
# LIVEKIT_API_SECRET
# LIVEKIT_URL

# ── Production environment ────────────────────────────────
# Wrangler v4: named envs do NOT auto-inherit top-level bindings.
# All bindings must be declared explicitly for [env.production].
[env.production]
name        = "loop-api"
workers_dev = false

[[env.production.d1_databases]]
binding       = "DB"
database_name = "loop-db"
database_id   = "4616fcac-96e0-4150-a42f-3d020f45cd1d"

[[env.production.kv_namespaces]]
binding    = "CACHE"
id         = "3c71da01b3174d6c9353adbfde7491a3"

[[env.production.r2_buckets]]
binding     = "MEDIA"
bucket_name = "loop-media"

[[env.production.queues.producers]]
binding = "TASK_QUEUE"
queue   = "loop-tasks"

[[env.production.queues.consumers]]
queue             = "loop-tasks"
max_batch_size    = 10
max_batch_timeout = 5

[[env.production.durable_objects.bindings]]
name       = "ROOM_SESSION"
class_name = "RoomSession"

[env.production.ai]
binding = "AI"

[env.production.observability]
enabled = true

[env.production.vars]
ENVIRONMENT   = "production"
SUPABASE_URL  = "https://onxdcikfttdmnhofsuwo.supabase.co"
CORS_ORIGIN   = "https://loop.rald.cloud,https://loop.ostinato-loop.pages.dev"
RALD_AUTH_URL = "https://auth.rald.cloud"

# Production secrets — pushed by deploy.yml via wrangler secret put:
# RALD_JWT_SECRET
# SUPABASE_SERVICE_ROLE_KEY
# TERMII_API_KEY
# TERMII_SENDER_ID
# OPENROUTER_API_KEY
# LIVEKIT_API_KEY
# LIVEKIT_API_SECRET
# LIVEKIT_URL

[[env.production.routes]]
pattern   = "loop-api.rald.cloud/*"
zone_name = "rald.cloud"
